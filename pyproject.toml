[project]
name = "mockfastapi"
version = "0.1.0"
description = "Local mock service for agent integration tests"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncmy>=0.2,<1",
    "fastapi>=0.116,<1",
    "mcp>=1.15,<2",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<8",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockfastapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
